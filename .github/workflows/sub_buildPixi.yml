# This is a build and test workflow for CI of FreeCAD.
# This workflow aims at building and testing FreeCAD on a Conda environment on macOS.

name: Pixi Builds

on:
  workflow_call:
    inputs:
      artifactBasename:
        type: string
        required: true
      testOnBuildDir:
        default: false
        type: boolean
        required: false
      testCoinNodeSnapshots:
        default: true
        type: boolean
        required: false
      skipBuild:
        default: false
        type: boolean
        required: false
      mirrorRunId:
        default: ''
        type: string
        required: false
      allowedToFail:
        default: false
        type: boolean
        required: false

permissions:
  contents: read

jobs:
  build_with_pixi:
    runs-on: ${{ inputs.skipBuild && 'ubuntu-latest' || matrix.os }}
    permissions:
      actions: read
      contents: read
    continue-on-error: ${{ inputs.allowedToFail }}
    env:
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_CONFIGPATH: ${{ github.workspace }}/ccache/config
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_NODIRECT: true
      CCACHE_NOHASHDIR: true
      CCACHE_NOINODECACHE: true
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,pch_defines,time_macros"
      builddir: ${{ github.workspace }}/build/release/
      cacheKey: pixi-${{ matrix.os }}
      config: release
      logdir: ${{ github.workspace }}/logs/
      shellCmd: "pixi run bash -l {0}"

    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest]

    steps:
    - name: Report result of previous run
      if: inputs.skipBuild && inputs.mirrorRunId != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        MIRROR_RUN_ID: ${{ inputs.mirrorRunId }}
        JOB_NAME_SUFFIX: build_with_pixi (${{ matrix.os }})
      with:
        script: |
          const runId = Number(process.env.MIRROR_RUN_ID);
          const suffix = process.env.JOB_NAME_SUFFIX;
          const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: runId,
            per_page: 100,
          });
          const previous = jobs.find(j => j.name.endsWith(suffix));
          if (!previous) {
            core.setFailed(`No job matching "${suffix}" in run ${runId}, re-run CI to build this commit`);
            return;
          }
          core.info(`Reporting result of ${previous.html_url}: ${previous.conclusion}`);
          if (!['success', 'skipped'].includes(previous.conclusion)) {
            core.setFailed(`${previous.name} concluded "${previous.conclusion}" in run ${runId}: ${previous.html_url}`);
          }

    - name: Harden the runner (Audit all outbound calls)
      if: "!inputs.skipBuild"
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Set Platform Environment Variables
      if: "!inputs.skipBuild"
      shell: bash -l {0}
      env:
        OPERATING_SYSTEM: ${{ runner.os }}
      run: |
        if [[ $OPERATING_SYSTEM == 'Windows' ]]; then
          echo 'CCACHE_COMPILERCHECK=%compiler%' >> "$GITHUB_ENV"
        else
          echo 'CCACHE_COMPILERCHECK=%compiler% -dumpfullversion -dumpversion' >> "$GITHUB_ENV"
        fi

    - name: Checkout
      if: "!inputs.skipBuild"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Add GCC Problem Matcher
      if: runner.os == 'Linux' && !inputs.skipBuild
      run: |
        echo "::add-matcher::${{ runner.workspace }}/FreeCAD/.github/problemMatcher/gcc.json"

    - name: Add Clang Problem Matcher
      if: runner.os == 'macOS' && !inputs.skipBuild
      run: |
        echo "::add-matcher::${{ runner.workspace }}/FreeCAD/.github/problemMatcher/clang.json"

    - name: Add MSVC++ Problem Matcher
      if: runner.os == 'Windows' && !inputs.skipBuild
      run: |
        echo "::add-matcher::${{ runner.workspace }}/FreeCAD/.github/problemMatcher/msvc.json"

    - name: Make build and log directories
      if: "!inputs.skipBuild"
      run: |
        mkdir -p ${{ env.builddir }}
        mkdir -p ${{ env.logdir }}

    - if: "!inputs.skipBuild"
      uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        pixi-version: v0.82.1
        cache: false
        locked: true

    - name: Restore Compiler Cache
      id: cache-restore
      if: "!inputs.skipBuild"
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
        restore-keys: |
          FC-${{ env.cacheKey }}-${{ github.ref }}-
          FC-${{ env.cacheKey }}-

    - name: Print CCache statistics before build, reset stats and print config
      if: "!inputs.skipBuild"
      run: |
        pixi run ccache -s
        pixi run ccache -z
        pixi run ccache -p

    - name: CMake Configure
      if: "!inputs.skipBuild"
      run: |
        pixi run configure-${{ env.config }}

    - name: CMake Build
      if: "!inputs.skipBuild"
      run: |
        pixi run build-${{ env.config }}

    - name: Print ccache statistics after Build
      if: "!inputs.skipBuild"
      run: |
        pixi run ccache -s

    - name: FreeCAD CLI tests on build dir
      if: inputs.testOnBuildDir && !inputs.skipBuild
      timeout-minutes: 10
      shell: ${{ env.shellCmd }}
      run: ctest --test-dir "${{ env.builddir }}" -R '^FreeCAD-PY-' --output-on-failure --no-tests=error

    - name: FreeCAD GUI tests on build dir
      if: runner.os == 'Linux' && inputs.testOnBuildDir && !inputs.skipBuild
      timeout-minutes: 15
      shell: ${{ env.shellCmd }}
      run: xvfb-run ctest --test-dir "${{ env.builddir }}" -R '^FreeCAD-GUI-' --output-on-failure --no-tests=error

    - name: Coin node snapshot visual tests on build dir
      if: runner.os == 'Linux' && inputs.testCoinNodeSnapshots && !inputs.skipBuild
      timeout-minutes: 15
      shell: ${{ env.shellCmd }}
      run: |
        FC_VISUAL_OUT_DIR="/tmp/FreeCADTesting/CoinNodeSnapshots" \
        xvfb-run -a -s "-screen 0 1024x768x24" \
          ctest --test-dir "${{ env.builddir }}" -R '^FreeCAD-GUI-TestCoinNodeSnapshots$' --output-on-failure --no-tests=error

    - name: Upload Coin node snapshot artifacts (on failure)
      if: failure() && runner.os == 'Linux' && inputs.testCoinNodeSnapshots && !inputs.skipBuild
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifactBasename }}-${{ matrix.os }}-CoinNodeSnapshots
        path: /tmp/FreeCADTesting/CoinNodeSnapshots

    - name: src/Tools tests
      if: "!inputs.skipBuild"
      run: pixi run python -m unittest discover -s src/Tools/tests -p "test_*.py"

    - name: Python binding generator tests
      if: "!inputs.skipBuild"
      run: pixi run python -m unittest discover -s src/Tools/bindings/tests -p "test_*.py"

    - name: Typing stub generator tests
      if: "!inputs.skipBuild"
      run: pixi run python -m unittest discover -s src/Tools/typing/stubgen -p "test_*.py"

    - name: C++ tests
      timeout-minutes: 10
      if: runner.os != 'Windows' && !inputs.skipBuild
      shell: ${{ env.shellCmd }}
      run: ctest --test-dir "${{ env.builddir }}" -R '^FreeCAD-CPP-' --output-on-failure --no-tests=error

    - name: CMake Install
      if: "!inputs.skipBuild"
      run: |
        pixi run install-${{ env.config }}

    - name: FreeCAD CLI tests on install
      if: runner.os != 'Windows' && !inputs.skipBuild
      timeout-minutes: 10
      shell: ${{ env.shellCmd }}
      run: FREECAD_TEST_USE_INSTALLED=1 ctest --test-dir "${{ env.builddir }}" -R '^FreeCAD-PY-' --output-on-failure --no-tests=error

    - name: FreeCAD GUI tests on install
      # if: runner.os == 'Linux' && !inputs.skipBuild
      # currently broken on Qt6 builds
      if: false
      timeout-minutes: 15
      shell: ${{ env.shellCmd }}
      run: FREECAD_TEST_USE_INSTALLED=1 xvfb-run ctest --test-dir "${{ env.builddir }}" -R '^FreeCAD-GUI-' --output-on-failure --no-tests=error

    - name: Save Compiler Cache
      id: cache-save
      if: "!inputs.skipBuild"
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}

    - name: Upload logs
      if: always() && !inputs.skipBuild
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifactBasename }}-${{ matrix.os }}-Logs
        path: |
          ${{ env.logdir }}
          ${{ env.builddir }}Testing/Temporary/
          /var/crash/*FreeCAD*
